name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            generator: "Ninja"
            artifact: plugins-windows
          - os: macos-latest
            generator: "Ninja"
            artifact: plugins-macos
          - os: ubuntu-latest
            generator: "Ninja"
            artifact: plugins-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Ninja
        shell: bash
        run: |
          if ! command -v ninja &> /dev/null; then
            NINJA_VERSION="1.11.1"
            curl -sSL "https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-win.zip" -o ninja.zip
            unzip -o ninja.zip -d $HOME/.local/bin/
            echo "$HOME/.local/bin" >> $GITHUB_PATH
          fi
          ninja --version

      - name: Download VST3 SDK
        shell: bash
        run: |
          cd iPlug2/Dependencies/IPlug
          if [ ! -f "VST3_SDK/base/source/baseiids.cpp" ]; then
            rm -rf VST3_SDK
            git clone https://github.com/steinbergmedia/vst3sdk.git --branch master --single-branch --depth=1 VST3_SDK
            git -C VST3_SDK submodule update --init --recursive --depth=1
          else
            echo "VST3 SDK already installed, skipping"
          fi

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libcairo2-dev libfreetype6-dev libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libxinerama-dev

      - name: Clean build directory
        shell: bash
        run: rm -rf build

      - name: Configure
        shell: bash
        run: |
          cmake -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release -DIPLUG2_DIR=${{ github.workspace }}/iPlug2

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/out/*.vst3

      - name: Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/out/*.vst3

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/out/*.vst3
